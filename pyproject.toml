[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7fhirgen"
version = "0.1.0"
description = "Generate, validate, and explain FHIR resources against any StructureDefinition profile — no vendor lock-in."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "mwaseem75" }]
keywords = ["fhir", "healthcare", "hl7", "interoperability", "structuredefinition", "profiling", "synthetic-data", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "Faker>=20.0.0",
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/mwaseem75/hl7fhirgen"
Repository = "https://github.com/mwaseem75/hl7fhirgen"
Issues = "https://github.com/mwaseem75/hl7fhirgen/issues"
Changelog = "https://github.com/mwaseem75/hl7fhirgen/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hl7fhirgen = "hl7fhirgen.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
